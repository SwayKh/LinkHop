{{define "title"}}Sign Up - URL Shortener{{end}}
{{define "content"}}
<div class="max-w-md mx-auto mt-10">
    <h2 class="text-3xl font-bold text-center mb-8">Create an Account</h2>
    <form method="POST" class="bg-white shadow-md rounded-lg px-8 pt-6 pb-8 mb-4">
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="email">Email</label>
            <input type="email" name="email" id="email" required
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Password</label>
            <input type="password" name="password" id="password" required
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
        <button type="submit"
            class="w-full bg-indigo-600 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline hover:bg-indigo-700">
            Sign Up
        </button>
    </form>
    <p class="text-center text-gray-600 text-sm">
        Already have an account? <a href="/login" class="text-indigo-600 hover:text-indigo-800">Login</a>
    </p>
</div>
{{end}}
