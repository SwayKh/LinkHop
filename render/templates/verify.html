{{define "title"}}Verify Email - URL Shortener{{end}}
{{define "content"}}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-sm border p-8">
            <div class="text-center mb-8">
                <div class="mx-auto w-12 h-12 bg-indigo-100 rounded-full flex items-center justify-center mb-4">
                    <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-gray-900">Verify Your Email</h2>
                <p class="text-gray-500 mt-2">We sent a 6-digit code to <strong class="text-gray-700">{{.FormEmail}}</strong></p>
            </div>
            <form method="POST" class="space-y-5">
                <input type="hidden" name="email" value="{{.FormEmail}}">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="code">Verification Code</label>
                    <input type="text" name="code" id="code" required maxlength="6" inputmode="numeric" pattern="[0-9]*"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-gray-900 text-center text-2xl tracking-widest placeholder-gray-400"
                        placeholder="000000">
                </div>
                <button type="submit"
                    class="w-full bg-indigo-600 text-white font-semibold py-2.5 px-4 rounded-lg hover:bg-indigo-700 focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition">
                    Verify Email
                </button>
            </form>
            <form method="POST" action="/resend-otp" class="text-center mt-4">
                <input type="hidden" name="email" value="{{.FormEmail}}">
                <button type="submit" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium">
                    Resend code
                </button>
            </form>
            <p class="text-center text-sm text-gray-500 mt-4">
                <a href="/signup" class="text-gray-500 hover:text-gray-700">Use a different email</a>
            </p>
        </div>
    </div>
</div>
{{end}}
